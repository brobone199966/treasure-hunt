<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>寻宝游戏 - 地图探索版</title>
    <style>
        body { background-color: #1a1a2e; color: #ecf0f1; font-family: 'Microsoft YaHei', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        #game-container { width: 90%; max-width: 800px; background: #16213e; padding: 20px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
        
        /* 状态栏 */
        #status-bar { display: flex; justify-content: space-between; align-items: center; background: #0f3460; padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .bar-container { width: 150px; height: 15px; background: #1a1a2e; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; transition: width 0.5s ease-in-out; }
        #hp-bar { background: linear-gradient(90deg, #e74c3c, #c0392b); width: 100%; }
        #progress-bar { background: linear-gradient(90deg, #3498db, #2980b9); width: 0%; }

        /* 地图画布 */
        #map-wrapper { position: relative; width: 100%; height: 280px; background: #1a1a2e; border-radius: 10px; margin-bottom: 15px; overflow: hidden; border: 2px solid #0f3460; }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .path-line { stroke: #0f3460; stroke-width: 4; stroke-dasharray: 8, 8; transition: all 0.5s; }
        .path-line.active { stroke: #e67e22; stroke-dasharray: none; }
        
        /* 地图节点 */
        .map-node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; height: 70px; border-radius: 50%; background: #0f3460; border: 3px solid #1a1a2e; transition: all 0.3s; z-index: 10; }
        .map-node .icon { font-size: 24px; }
        .map-node .label { font-size: 10px; color: #aaa; margin-top: 2px; white-space: nowrap; }
        .map-node.active { border-color: #e67e22; box-shadow: 0 0 15px #e67e22; cursor: pointer; animation: pulse 1.5s infinite; background: #3a1e0e; }
        .map-node.visited { border-color: #2ecc71; opacity: 0.7; }
        .map-node.current { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f; z-index: 20; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* 英雄 */
        #hero { position: absolute; font-size: 36px; transition: all 1s cubic-bezier(0.68, -0.55, 0.27, 1.55); z-index: 30; transform: translate(-50%, -50%); }

        /* 日志与按钮 */
        #log { text-align: left; height: 100px; overflow-y: auto; background: #0f3460; padding: 15px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
        .log-entry { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }

        #interaction-area { min-height: 50px; display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn { background: linear-gradient(135deg, #e67e22, #d35400); color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-size: 14px; transition: all 0.3s; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4); }
        .btn:hover { transform: scale(1.05); }
        .btn-choice { background: linear-gradient(135deg, #3498db, #2980b9); box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); }
        .btn:disabled { background: #7f8c8d; box-shadow: none; transform: none; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="status-bar">
            <div>❤️ 体力 <span id="hp-text">100</span>/100 <div class="bar-container"><div class="bar-fill" id="hp-bar"></div></div></div>
            <div>🚩 进度 <span id="progress-text">0</span>% <div class="bar-container"><div class="bar-fill" id="progress-bar"></div></div></div>
        </div>
        
        <!-- 地图画布 -->
        <div id="map-wrapper">
            <svg id="map-svg"></svg>
            <div id="hero">🧑‍🚀</div>
            <!-- 节点由 JS 动态生成 -->
        </div>

        <div id="log">做好准备，点击开始探索吧！</div>
        <div id="interaction-area">
            <button class="btn" onclick="startGame(false)">开始寻宝</button>
        </div>
    </div>

    <script src="treasure.js"></script>
</body>
</html>
